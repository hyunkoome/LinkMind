name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (no infra)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install lightweight test deps
        # 전체 requirements.txt 는 무거우므로 단위 테스트용으로 분리한
        # requirements-test.txt 사용. CI 는 순수 cpu mock 단위 테스트만 돌리므로
        # torch / sentence-transformers 는 설치하지 않는다 (embedding/gpu 디렉토리 제외).
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-test.txt

      - name: Run pytest (CPU-only — 실 인프라/GPU/임베딩 필요 테스트는 collect 제외)
        env:
          # conftest.py 가 더미값을 채우지만 환경에서도 한 번 더 보호.
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        # gpu(CUDA) / embedding(torch 다운로드) / integration(Postgres·Qdrant) /
        # llm(Ollama) 디렉토리는 CI 환경에 해당 인프라가 없으므로 아예 collect 에서
        # 제외 — import 단계 실패/무거운 의존성 회피. 이 회귀들은 로컬 전체 테스트가 잡는다.
        run: |
          python -m pytest tests/ -v --maxfail=5 \
            --ignore=tests/gpu \
            --ignore=tests/embedding \
            --ignore=tests/integration \
            --ignore=tests/llm
