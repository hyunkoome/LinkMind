# ============================================================================
# LinkMind — Docker Compose (개발 환경)
# ----------------------------------------------------------------------------
# 사용:
#   cd compose
#   docker compose -f docker-compose.dev.yml --env-file ../env/dev.env up -d
#
# Phase 2 서비스(tei, minio)는 profile로 게이트됨:
#   docker compose -f docker-compose.dev.yml --profile phase2 up -d
#
# 데이터 영속성: bind mount. 기본 ${VOLUMES_ROOT:-../volumes}/ (프로젝트 디렉토리 안).
# 다른 위치 (예: 큰 디스크 /mnt/data/linkmind/) 로 옮기려면 env/dev.env 의
# VOLUMES_ROOT 에 절대경로 지정. 모든 컨테이너 (postgres/qdrant/ollama/openwebui/
# minio/redis/models) 의 bind mount root 가 한 번에 바뀜.
#   예: VOLUMES_ROOT=/mnt/data/linkmind/volumes
#   default: ../volumes (compose/ 디렉토리 기준 = 프로젝트 루트의 volumes/)
# ============================================================================

# GPU 사용 서비스(ollama, tei)는 nvidia-container-toolkit 필요.
# 호스트 확인: nvidia-smi && docker run --rm --gpus all nvidia/cuda:12.4.0-base nvidia-smi

services:

  # ─────────────────────────────────────────────────────────────
  # PostgreSQL — 메인 RDB (raw_content, provenance, metadata 저장)
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: linkmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-linkmind}
    ports:
      - "5432:5432"
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/postgres:/var/lib/postgresql/data
      # 초기 스키마 자동 적용
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkmind} -d ${POSTGRES_DB:-linkmind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # Qdrant — 벡터 검색
  # ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: linkmind-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"       # REST API
      - "6334:6334"       # gRPC
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/qdrant:/qdrant/storage
    healthcheck:
      # Qdrant 공식 이미지에는 wget/curl이 없을 수 있어 단순 TCP 체크 대신
      # 헬스 엔드포인트를 bash builtin으로 호출.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # Ollama — 로컬 LLM 런타임 (GPU)
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: linkmind-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/ollama:/root/.ollama
      - ${VOLUMES_ROOT:-../volumes}/models:/models
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_KEEP_ALIVE: "24h"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/11434' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # vLLM — production-grade LLM 서빙 (OpenAI 호환). Ollama 대비 2-10x throughput.
  # paged attention + continuous batching, RTX 4090 잘 활용.
  # Phase 3 의 main inference engine. Ollama 는 디버깅/cli/모델관리용으로 유지.
  # 첫 startup 시 모델 (예: Qwen/Qwen2.5-7B-Instruct ~15GB) HF Hub 다운로드 — 시간 큼.
  # ─────────────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: linkmind-vllm
    restart: unless-stopped
    profiles: ["vllm"]                  # 기본 profile 안 시작 — 활성화: `--profile vllm`
    ports:
      - "8001:8000"                     # 호스트 8001 (backend 의 8000 과 충돌 회피)
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/vllm-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}"
      - "--port"
      - "8000"
      # dtype — 양자화 모델용. Gemma 4 26B-A4B-AWQ 는 float16 권장 (AWQ kernel).
      # Qwen 미양자화는 auto (bf16). quantization 자체는 모델 HF config 의
      # quantization_config 로 vLLM 이 자동 감지 → --quantization 명시 불필요.
      - "--dtype"
      - "${VLLM_DTYPE:-auto}"
      # reasoning parser — Gemma 4 (E2B/E4B 제외) 는 thinking 을 꺼도 <|channel>thought 태그를
      # 생성한다. 이 parser 가 thought 를 reasoning_content 로 분리해 content 를 깨끗하게 유지.
      # 안 주면 control 토큰이 위키 본문에 그대로 섞임. (Qwen 으로 되돌리려면 이 2줄 제거.)
      - "--reasoning-parser"
      - "${VLLM_REASONING_PARSER:-gemma4}"
      # 멀티모달 끄기 — Gemma 4 는 vision/audio encoder 가 KV cache 를 잠식한다. 우리는
      # 텍스트 위키만 생성하므로 image/audio/video 를 0 으로 제한해 그 메모리를 KV 로 회수
      # → 8192 context + 16384 batched 가능 (기능 손실 없음, 2026-05-30). Qwen 복원 시 제거.
      - "--limit-mm-per-prompt"
      - '{"image": 0, "video": 0, "audio": 0}'
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.85}"
      # KV cache fp8 — KV 메모리 절반 → context 2배(16384) 가능. 자료 많은 위키(input 큼)
      # + 긴 출력(max_tokens 6144) 을 8192 한계 없이 처리. 품질 손실 미미 (2026-05-30).
      - "--kv-cache-dtype"
      - "${VLLM_KV_CACHE_DTYPE:-fp8}"
      # --enable-lora 제거 (2026-05-30): Gemma 4 MoE 는 LoRA 미지원
      #   (AttributeError: get_expert_mapping must be implemented). Phase 4 LoRA hot-swap 은
      #   LoRA 지원 모델로 갈 때 다시 추가. Qwen 으로 되돌리려면 이 줄 복원.
      # ── throughput 최적화 (2026-05-26) ──
      - "--enable-prefix-caching"       # system prompt 매번 동일 → KV cache 재사용 (~20% 빨라짐)
      - "--max-num-batched-tokens"
      - "${VLLM_MAX_BATCHED_TOKENS:-16384}"  # default 8192 → 4 sequence × 2925 tokens 안전
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-32}"      # 동시 처리 sequence 한계 (concurrent N=4 충분 여유)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60                       # start_period 동안 fail 도 무시되니 retries 는 안정 후 용
      start_period: 1800s               # 첫 모델 다운로드 (HF 15GB, unauth slow) + cudagraph capture
                                        # 5분으론 부족해 unhealthy → restart loop. 30분 보장.
    ipc: host                           # vLLM 권장 — shared memory 최적화
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # vLLM-embed — bge-m3 (또는 다른 embedding 모델) 전용 인스턴스.
  # LinkMind 의 모든 embedding 호출 (uvicorn / watcher / CLI) 이 이 HTTP 서버를 공유 →
  # GPU 에 모델 1번만 로드, OOM 방지. CLAUDE.md §13 D13.
  # 같은 GPU 를 LLM 인스턴스와 공유하므로 gpu_memory_utilization 분할 필요:
  #   LLM (Qwen2.5-7B): ~0.75 → 18 GB
  #   Embed (bge-m3) : ~0.15 → 3.6 GB
  #   합계 ~21.6 GB / 24 GB → 여유 2.4 GB
  # ─────────────────────────────────────────────────────────────
  vllm-embed:
    image: vllm/vllm-openai:latest
    container_name: linkmind-vllm-embed
    restart: unless-stopped
    profiles: ["vllm"]                  # vllm profile 활성화 시 같이 뜸
    depends_on:
      vllm:
        condition: service_started      # LLM 이 먼저 GPU reserve 끝낸 후 embed 시작 (안전)
    ports:
      - "8002:8000"                     # 호스트 8002 (backend 8000 / vllm-llm 8001 충돌 회피)
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/vllm-cache:/root/.cache/huggingface
    command:
      - "--model"
      - "${VLLM_EMBED_MODEL:-BAAI/bge-m3}"
      - "--port"
      - "8000"
      - "--runner"
      - "pooling"                       # vLLM 0.21+ — embedding/pooling 모드
      - "--gpu-memory-utilization"
      - "${VLLM_EMBED_GPU_MEM_UTIL:-0.15}"
      - "--max-model-len"
      - "${VLLM_EMBED_MAX_MODEL_LEN:-8192}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 600s                # bge-m3 1.4 GB 다운로드 + cudagraph capture
    ipc: host
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # OpenWebUI — Ollama용 웹 UI (선택, 디버깅/모델 관리에 유용)
  # ─────────────────────────────────────────────────────────────
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: linkmind-openwebui
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "false"     # 로컬 단일 사용자 가정. 향후 외부 노출 시 활성화.
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/openwebui:/app/backend/data
    depends_on:
      ollama:
        condition: service_started
    networks:
      - linkmind

  # ═════════════════════════════════════════════════════════════
  # Phase 2 services (profile: phase2)
  # ═════════════════════════════════════════════════════════════

  # ─────────────────────────────────────────────────────────────
  # TEI — Text Embeddings Inference (HuggingFace)
  # Phase 2: sentence-transformers를 떼고 전용 임베딩 서버로 스왑.
  # ─────────────────────────────────────────────────────────────
  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: linkmind-tei
    restart: unless-stopped
    profiles: ["phase2"]
    ports:
      - "8080:80"
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/models:/data
    command:
      - "--model-id=${EMBEDDING_MODEL:-BAAI/bge-m3}"
      - "--max-batch-tokens=16384"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # MinIO — S3 호환 object storage (Phase 2)
  # 학습 데이터셋 export, 이미지/PDF 대용량 저장용.
  # ─────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: linkmind-minio
    restart: unless-stopped
    profiles: ["phase2"]
    ports:
      - "9000:9000"       # S3 API
      - "9001:9001"       # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - linkmind

  # ─────────────────────────────────────────────────────────────
  # Redis (Phase 2) — 큐/캐시
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: linkmind-redis
    restart: unless-stopped
    profiles: ["phase2"]
    ports:
      - "6379:6379"
    volumes:
      - ${VOLUMES_ROOT:-../volumes}/redis:/data
    command: redis-server --appendonly yes
    networks:
      - linkmind

networks:
  linkmind:
    name: linkmind
    driver: bridge
